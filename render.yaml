# Render Blueprint: RoboRoute as one public web service, built from the Dockerfile.
# Setup steps: docs/deploy-render.md
services:
  - type: web
    name: roboroute
    runtime: docker
    dockerfilePath: ./Dockerfile
    # free: sleeps after ~15 idle minutes (the next visit takes up to a minute to wake it).
    # starter: always on. Changing plan needs no other change.
    plan: free
    # Pick the region closest to your users (oregon, ohio, virginia, frankfurt, singapore).
    region: oregon
    healthCheckPath: /api/v1/health
    # Deploy a new commit on main only after its GitHub checks (CI) have passed.
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      # Render's proxy forwards the visitor's address; trust it so limits apply per visitor.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Heavy calculations (routes, optimise, simulate) per visitor address per minute. A
      # classroom often shares one address, so keep this generous.
      - key: ROBOROUTE_RATE_LIMIT_PER_MINUTE
        value: "60"
      # Calculations running at the same time; others wait up to 30 s for a slot.
      - key: ROBOROUTE_MAX_CONCURRENT_JOBS
        value: "2"
