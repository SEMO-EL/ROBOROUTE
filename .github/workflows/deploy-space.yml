name: Deploy to Hugging Face Space

# Publishes main to a Hugging Face Space after CI has passed on it (or on demand from the
# Actions tab). Setup: docs/deploy-huggingface.md. Does nothing until the repository variable
# HF_SPACE (e.g. "your-name/roboroute") and the secret HF_TOKEN exist.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Push to the Space
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Assemble the Space
        run: ./scripts/assemble-space.sh "$RUNNER_TEMP/space"
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN secret is missing (see docs/deploy-huggingface.md)."
            exit 1
          fi
          cd "$RUNNER_TEMP/space"
          git init --quiet --initial-branch=main
          git config user.name "RoboRoute deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add --all
          git commit --quiet --message "Deploy ${SOURCE_SHA}"
          git push --force --quiet "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Deployed ${SOURCE_SHA} to https://huggingface.co/spaces/${HF_SPACE}"
