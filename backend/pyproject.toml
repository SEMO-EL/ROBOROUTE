[project]
name = "roboroute"
version = "0.1.0"
description = "Strategy optimisation and simulation engine for student robotics competitions"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic>=2.14,<3",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "mypy>=2.4",
    "httpx2>=2.16",
    "networkx>=3.7",
    "shapely>=2.2",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roboroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running statistical or benchmark-style tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow Greek letters / math symbols in strings and comments

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["roboroute"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "shapely.*"]
ignore_missing_imports = true
